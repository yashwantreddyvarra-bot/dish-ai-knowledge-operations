services:
  - type: web
    name: dish-backend
    runtime: docker
    plan: free
    branch: feature/dish-doc-automation
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DISH_EMAIL
        sync: false
      - key: DISH_PASSWORD
        sync: false
      - key: LLM_MODEL
        value: gpt-4o
      - key: CAPTURE_HEADLESS
        value: "true"
      - key: DEMO_PRODUCT_NAME
        value: Sparkling Water
