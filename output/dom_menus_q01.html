        <style>
            .loader-wrapper {
                margin: 0;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                overflow: hidden;
                z-index: 20;
            }
            .loader,
            .loader:after {
                border-radius: 50%;
                width: 10em;
                height: 10em;
            }
            .loader {
                margin: 60px auto;
                font-size: 10px;
                position: relative;
                text-indent: -9999em;
                border-top: 1.1em solid rgba(198, 19, 127, 0.2);
                border-right: 1.1em solid rgba(198, 19, 127, 0.2);
                border-bottom: 1.1em solid rgba(198, 19, 127, 0.2);
                border-left: 1.1em solid #c6137f;
                -webkit-transform: translateZ(0);
                -ms-transform: translateZ(0);
                transform: translateZ(0);
                -webkit-animation: load8 1.1s infinite linear;
                animation: load8 1.1s infinite linear;
            }

            .dish .loader {
                border-top: 1.1em solid rgba(236, 106, 56, 0.2);
                border-right: 1.1em solid rgba(236, 106, 56, 0.2);
                border-bottom: 1.1em solid rgba(236, 106, 56, 0.2);
                border-left: 1.1em solid #ec6a38;
            }
            @-webkit-keyframes load8 {
                0% {
                    -webkit-transform: rotate(0deg);
                    transform: rotate(0deg);
                }
                100% {
                    -webkit-transform: rotate(360deg);
                    transform: rotate(360deg);
                }
            }
            @keyframes load8 {
                0% {
                    -webkit-transform: rotate(0deg);
                    transform: rotate(0deg);
                }
                100% {
                    -webkit-transform: rotate(360deg);
                    transform: rotate(360deg);
                }
            }
        </style>
